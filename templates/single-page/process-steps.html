<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Process Steps</title>
<link rel="stylesheet" href="../../assets/fonts.css">
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" id="theme-link" href="../../assets/themes/minimal-white.css">
<link rel="stylesheet" href="../../assets/animations/animations.css">
</head><body class="single">
<div class="deck"><section class="slide is-active" data-title="Process">
  <p class="kicker">How-to · 네 단계로 덱 하나</p>
  <h2 class="h2">아무것도 없는 상태에서 10분이면 됩니다</h2>
  <div class="steps anim-stagger-list" data-anim-target>
    <div class="step"><div class="num">1</div><h4>뼈대 만들기</h4><p><code>new-deck.sh</code> 를 실행하면 6장짜리 기본 덱이 생깁니다.</p><span class="tag">~30s</span></div>
    <div class="step"><div class="num">2</div><h4>레이아웃 고르기</h4><p><code>templates/single-page/</code> 에서 필요한 페이지 유형을 복사합니다.</p><span class="tag">~2min</span></div>
    <div class="step"><div class="num">3</div><h4>내용 쓰기</h4><p>구조는 그대로 두고 데모 데이터만 갈아끼웁니다.</p><span class="tag">~6min</span></div>
    <div class="step"><div class="num">4</div><h4>테마 정하기</h4><p><b>T</b> 로 36개 테마를 돌려 보고 하나로 확정합니다.</p><span class="tag">~1min</span></div>
  </div>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
