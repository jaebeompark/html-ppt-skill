<div class="deck"><section class="slide is-active" data-title="Pros Cons">
  <p class="kicker">Trade-offs · 정직한 맞바꿈</p>
  <h2 class="h2">순수 HTML 발표, 좋은 점과 아픈 점</h2>
  <div class="pc">
    <div class="card pro anim-fade-up" data-anim="fade-up"><h3><span class="b">✓</span> 좋은 점</h3>
      <ul><li>빌드가 없다 — 파일 하나면 돌아간다</li><li>diff 가 된다 — Git 에 얹기 좋고 리뷰도 쉽다</li><li>코드로 다룬다 — 애니메이션을 마음대로 짠다</li><li>어디로든 보낸다 — URL · PDF · PNG</li></ul>
    </div>
    <div class="card con anim-fade-up" data-anim="fade-up"><h3><span class="b">✗</span> 아픈 점</h3>
      <ul><li>Keynote 처럼 실시간 협업이 되지 않는다</li><li>개발자가 아니면 초반이 가파르다</li><li>복잡한 효과는 결국 JS 를 써야 한다</li><li>오프라인에서는 일부 웹폰트가 빠진다</li></ul>
    </div>
  </div>
